<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looksmaxxing Gambling 🎰</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --common:#9ca3af; --uncommon:#22c55e; --rare:#3b82f6;
    --epic:#a855f7; --legendary:#f59e0b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f1e 70%);
    color: #e5e7eb; min-height: 100vh; padding: 20px;
  }
  .app { max-width: 1100px; margin: 0 auto; }

  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
  h1 {
    font-size: 1.4rem;
    background: linear-gradient(90deg, #f59e0b, #a855f7, #3b82f6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-stats { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .stat-pill {
    padding: 6px 14px; border-radius: 999px; font-weight: bold;
    font-size: 0.85rem; transition: transform 0.2s; border: 1px solid; white-space: nowrap;
  }
  .stat-pill.wallet { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: #fbbf24; font-size: 1rem; }
  .stat-pill.luck { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: #4ade80; }
  .stat-pill.world { background: rgba(168,85,247,0.15); border-color: rgba(168,85,247,0.4); color: #d8b4fe; }
  .stat-pill.psl { font-size: 1rem; }
  .stat-pill.flash { transform: scale(1.15); }
  .reset-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: #9ca3af; padding: 6px 12px; border-radius: 8px;
    cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: #ef4444; color: #ef4444; }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 8px; flex-wrap: wrap;
  }
  .tab {
    background: transparent; border: none; color: #9ca3af;
    padding: 10px 14px; border-radius: 8px; cursor: pointer;
    font-size: 0.85rem; font-weight: bold; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { background: rgba(255,255,255,0.05); color: #e5e7eb; }
  .tab.active {
    background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(168,85,247,0.2));
    color: #fbbf24; border: 1px solid rgba(245,158,11,0.4);
  }
  .tab .badge {
    background: rgba(255,255,255,0.1); border-radius: 999px;
    padding: 2px 8px; font-size: 0.65rem; color: #e5e7eb;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .cases { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:16px; margin-bottom:30px; }
  .case-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; transition: all 0.25s;
  }
  .case-card:hover { transform: translateY(-4px); border-color: rgba(245,158,11,0.5); }
  .case-card.bronze { border-top: 3px solid #b45309; }
  .case-card.silber { border-top: 3px solid #9ca3af; }
  .case-card.gold   { border-top: 3px solid #f59e0b; }
  .case-icon { font-size: 2.5rem; text-align: center; }
  .case-name { text-align: center; font-weight: bold; font-size: 1.05rem; }
  .case-price { text-align: center; color: #fbbf24; font-weight: bold; font-size: 1.15rem; }
  .case-mystery-hint { text-align: center; font-size: 0.7rem; color: #a855f7; font-weight: bold; }
  .drop-bar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:rgba(0,0,0,0.3); }
  .drop-bar > div { height: 100%; }
  .drop-legend { display:flex; justify-content:space-between; font-size:0.7rem; gap:4px; }
  .drop-legend span { flex: 1; text-align: center; }
  .open-btn {
    padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #1a1a2e; font-weight: bold; font-size: 1rem;
    cursor: pointer; transition: all 0.2s; margin-top: auto;
  }
  .open-btn:hover:not(:disabled) { transform: scale(1.03); box-shadow: 0 4px 20px rgba(245,158,11,0.4); }
  .open-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .roulette-viewport {
    width: 100%; max-width: 700px; height: 190px; overflow: hidden;
    position: relative; margin: 0 auto 20px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
  }
  .roulette-marker {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 2px; height: 100%;
    background: linear-gradient(to bottom, transparent, #fbbf24, transparent);
    z-index: 10; pointer-events: none; box-shadow: 0 0 12px #fbbf24;
  }
  .roulette-marker::before, .roulette-marker::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    border-left: 9px solid transparent; border-right: 9px solid transparent;
  }
  .roulette-marker::before { top: -2px; border-top: 14px solid #fbbf24; }
  .roulette-marker::after { bottom: -2px; border-bottom: 14px solid #fbbf24; }
  .roulette-strip { display:flex; gap:10px; height:100%; padding:15px 0; will-change:transform; }
  .strip-item {
    flex: 0 0 140px; height: 160px;
    background: rgba(255,255,255,0.04);
    border: 2px solid var(--rc, #666); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 10px; text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.03);
  }
  .strip-item.mystery-slot {
    background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(168,85,247,0.05));
    border-color: #a855f7; animation: mysteryPulse 1s infinite;
  }
  @keyframes mysteryPulse {
    0%,100% { box-shadow: 0 0 10px rgba(168,85,247,0.3); }
    50% { box-shadow: 0 0 30px rgba(168,85,247,0.8); }
  }
  .strip-item-emoji { font-size: 1.8rem; }
  .strip-item-cat { font-size: 0.6rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
  .strip-item-name { font-size: 0.72rem; color: #e5e7eb; font-weight: bold; line-height: 1.2; }
  .strip-item-rar { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; color: var(--rc); font-weight: bold; }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #6b7280; font-size: 1rem; pointer-events: none;
  }
  .placeholder.hidden { display: none; }

  .result-panel {
    max-width: 700px; margin: 0 auto 30px; padding: 18px 24px;
    border-radius: 14px; text-align: center; opacity: 0;
    transform: translateY(-10px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .result-panel.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .tag-row { display:flex; gap:6px; justify-content:center; margin-bottom:8px; flex-wrap:wrap; }
  .tag {
    display: inline-block; font-size: 0.65rem; padding: 3px 10px;
    border-radius: 999px; font-weight: bold; letter-spacing: 1px;
  }
  .tag.upgrade { background: linear-gradient(135deg,#22c55e,#16a34a); color:#fff; animation: pulse 1.5s infinite; }
  .tag.duplicate { background: linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
  .tag.mystery { background: linear-gradient(135deg,#a855f7,#7c3aed); color:#fff; animation: pulse 1s infinite; }
  .tag.xp { background: linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .result-emoji { font-size: 2.5rem; margin-bottom: 4px; }
  .result-cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #9ca3af; margin-bottom: 4px; }
  .result-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 4px; }
  .result-rarity { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; font-weight: bold; }
  .sell-btn {
    padding: 8px 20px; border: 1px solid currentColor;
    background: rgba(0,0,0,0.3); color: inherit;
    border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    font-weight: bold; transition: all 0.2s;
  }
  .sell-btn:hover { background: rgba(255,255,255,0.1); }
  .mystery-reveal { animation: revealAnim 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes revealAnim {
    0% { opacity:0; transform:scale(0.3) rotate(-20deg); }
    100% { opacity:1; transform:scale(1) rotate(0); }
  }

  .best-draw {
    background: linear-gradient(135deg, var(--c, #6b7280) 22, #0f0f1e);
    border: 1px solid var(--c, #374151);
    border-radius: 14px; padding: 20px; margin-bottom: 24px;
  }
  .best-draw.legendary { box-shadow: 0 0 30px rgba(245,158,11,0.25); }
  .best-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
    color: #9ca3af; margin-bottom: 12px; font-weight: bold;
  }
  .best-content { display: flex; align-items: center; gap: 20px; }
  .best-emoji { font-size: 3.5rem; flex-shrink: 0; }
  .best-info { flex: 1; }
  .best-cat { font-size: 0.72rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  .best-name { font-size: 1.4rem; font-weight: bold; color: #f3f4f6; margin-bottom: 6px; }
  .best-rar { font-size: 0.8rem; font-weight: bold; letter-spacing: 2px; color: var(--c); }
  .best-empty { color: #6b7280; font-style: italic; padding: 8px 0; }

  .section-title { font-size:1.05rem; margin-bottom:14px; color:#e5e7eb; display:flex; align-items:center; gap:10px; }
  .section-title .count { color:#6b7280; font-weight:normal; font-size:0.85rem; }

  .char-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; }
  .char-card {
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--c, rgba(255,255,255,0.1));
    border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; transition: all 0.3s;
  }
  .char-card.filled { background: linear-gradient(180deg, var(--c-tint, rgba(255,255,255,0.03)), rgba(255,255,255,0.02)); }
  .char-card.empty { opacity: 0.4; }
  .char-card.just-upgraded { animation: glowUp 1.2s ease-out; }
  @keyframes glowUp {
    0% { box-shadow: 0 0 0 0 var(--c); transform: scale(1.05); }
    50% { box-shadow: 0 0 30px 5px var(--c); }
    100% { box-shadow: 0 0 0 0 var(--c); transform: scale(1); }
  }
  .char-head { display: flex; align-items: center; gap: 8px; }
  .char-emoji { font-size: 1.2rem; }
  .char-cat { font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  .char-val { font-size: 1rem; font-weight: bold; color: #e5e7eb; }
  .char-rar { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--c); font-weight: bold; }
  .char-card.empty .char-val { color: #4b5563; }

  .collection-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; }
  .col-cat { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px; }
  .col-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .col-head-emoji { font-size: 1.1rem; }
  .col-head-name { font-size: 0.85rem; font-weight: bold; }
  .col-head-progress { margin-left:auto; font-size:0.7rem; color:#6b7280; }
  .col-tiers { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .col-tier {
    padding: 6px 3px; border-radius: 6px; font-size: 0.6rem;
    text-align: center; font-weight: bold;
    border: 1px solid var(--c, #374151);
    background: var(--c-tint, rgba(255,255,255,0.03));
    color: #e5e7eb; line-height: 1.2; min-height: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .col-tier.locked { opacity:0.35; color:#6b7280; font-style:italic; filter:grayscale(1); }

  .inv-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:10px; }
  .empty-inv { color:#6b7280; grid-column:1/-1; text-align:center; padding:40px; }
  .inv-item {
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--c, #666);
    border-radius: 10px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from{opacity:0; transform:scale(0.8);} to{opacity:1; transform:scale(1);} }
  .inv-emoji { font-size: 1.6rem; }
  .inv-cat { font-size: 0.55rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
  .inv-name { font-size: 0.78rem; font-weight: bold; color: #e5e7eb; min-height: 2em; }
  .inv-rar { font-size: 0.55rem; font-weight: bold; letter-spacing: 1px; color: var(--c); text-transform: uppercase; }
  .inv-item .sell-btn { font-size: 0.7rem; padding: 4px 10px; margin-top: 4px; }

  .world-hero {
    background: linear-gradient(135deg, var(--wc, #6b7280) 22, #0f0f1e);
    border: 2px solid var(--wc, #374151);
    border-radius: 16px; padding: 32px 20px;
    text-align: center; margin-bottom: 24px;
    box-shadow: 0 0 40px var(--wc-glow, rgba(107,114,128,0.2));
  }
  .world-hero-emoji { font-size: 4rem; margin-bottom: 8px; }
  .world-hero-name { font-size: 1.8rem; font-weight: bold; color: var(--wc, #e5e7eb); margin-bottom: 4px; }
  .world-hero-sub { font-size: 0.9rem; color: #9ca3af; }
  .prestige-info { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:10px; margin-bottom:20px; }
  .prestige-stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 14px; text-align: center;
  }
  .prestige-stat-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:#9ca3af; margin-bottom:6px; }
  .prestige-stat-value { font-size:1.2rem; font-weight:bold; color:#e5e7eb; }
  .prestige-btn {
    width: 100%; padding: 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff; font-weight: bold; font-size: 1.05rem;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 0 30px rgba(168,85,247,0.3);
  }
  .prestige-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 40px rgba(168,85,247,0.6); }
  .prestige-btn:disabled { background: rgba(255,255,255,0.05); color: #6b7280; cursor: not-allowed; box-shadow: none; }

  .psl-hero {
    background: linear-gradient(135deg, var(--pc, #6b7280) 22, #0f0f1e);
    border: 2px solid var(--pc, #374151);
    border-radius: 16px; padding: 28px 20px;
    text-align: center; margin-bottom: 20px;
    box-shadow: 0 0 40px var(--pc-glow, rgba(107,114,128,0.2));
    position: relative; overflow: hidden;
  }
  .psl-hero.max { box-shadow: 0 0 60px var(--pc-glow, rgba(236,72,153,0.4)); animation: maxGlow 3s infinite; }
  @keyframes maxGlow {
    0%,100% { box-shadow: 0 0 40px rgba(236,72,153,0.3); }
    50% { box-shadow: 0 0 80px rgba(236,72,153,0.7); }
  }
  .psl-hero-emoji { font-size: 5rem; margin-bottom: 4px; }
  .psl-hero-name { font-size: 2rem; font-weight: bold; color: var(--pc); margin-bottom: 4px; letter-spacing: 2px; }
  .psl-hero-score { font-size: 1.1rem; color: #9ca3af; margin-bottom: 16px; }
  .psl-attrs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px auto; max-width:500px; }
  .psl-attr {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 6px; text-align: center;
  }
  .psl-attr-label { font-size:0.62rem; text-transform:uppercase; letter-spacing:1px; color:#9ca3af; margin-bottom:4px; }
  .psl-attr-value { font-size:1.05rem; font-weight:bold; color:#e5e7eb; }
  .psl-progress-wrap {
    max-width: 500px; margin: 0 auto;
    background: rgba(0,0,0,0.4); border-radius: 999px;
    height: 24px; overflow: hidden; position: relative;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .psl-progress-bar {
    height: 100%; background: var(--pc);
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
    border-radius: 999px; box-shadow: 0 0 20px var(--pc);
  }
  .psl-progress-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: bold; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .psl-next { font-size: 0.85rem; color: #9ca3af; margin-top: 10px; }

  .minigames-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; margin-bottom:20px; }
  .minigame-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; transition: all 0.2s;
  }
  .minigame-card:not(.on-cooldown):hover { border-color: rgba(245,158,11,0.4); }
  .minigame-card.on-cooldown { opacity: 0.5; }
  .minigame-head { display:flex; align-items:center; gap:8px; }
  .minigame-emoji { font-size: 1.4rem; }
  .minigame-name { font-weight: bold; font-size: 0.9rem; }
  .minigame-desc { font-size: 0.72rem; color: #9ca3af; line-height: 1.3; min-height: 2.5em; }
  .minigame-btn {
    padding: 10px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff; font-weight: bold; cursor: pointer;
    transition: all 0.2s; font-size: 0.85rem;
  }
  .minigame-btn:hover:not(:disabled) { transform: scale(1.02); }
  .minigame-btn:disabled { background: rgba(255,255,255,0.05); color: #6b7280; cursor: not-allowed; }
  .mg-play-area {
    background: rgba(0,0,0,0.3); border-radius: 8px;
    padding: 12px; min-height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; font-size: 0.8rem; position: relative; overflow: hidden;
  }
  .mewing-track {
    width: 100%; height: 20px; background: rgba(255,255,255,0.05);
    border-radius: 999px; position: relative; overflow: hidden;
  }
  .mewing-target {
    position: absolute; top: 0; bottom: 0; left: 42%; width: 16%;
    background: rgba(34,197,94,0.4);
    border-left: 2px solid #22c55e; border-right: 2px solid #22c55e;
  }
  .mewing-cursor {
    position: absolute; top: -4px; bottom: -4px; width: 3px;
    background: #fbbf24; box-shadow: 0 0 10px #fbbf24; border-radius: 2px;
  }
  .jawline-counter { font-size:2rem; font-weight:bold; color:#fbbf24; font-family:monospace; }
  .jawline-btn-big {
    padding: 20px 40px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #1a1a2e; font-weight: bold; font-size: 1.1rem;
    cursor: pointer; transition: transform 0.05s; user-select: none;
  }
  .jawline-btn-big:active { transform: scale(0.95); }
  .reaction-box {
    width: 100%; height: 80px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 1.1rem;
    background: #374151; color: #e5e7eb;
    cursor: pointer; transition: background 0.1s; user-select: none;
  }
  .reaction-box.waiting { background: #1f2937; color: #6b7280; cursor: wait; }
  .reaction-box.ready { background: #22c55e; color: #fff; cursor: pointer; animation: reactionPulse 0.3s infinite; }
  @keyframes reactionPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.02);} }

  .psl-tierlist { display:grid; gap:6px; margin-top:16px; }
  .psl-tier-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 0.85rem;
  }
